---
apiVersion: v1
kind: Namespace
metadata:
  name: kubeclustersnap-system
  labels:
    app.kubernetes.io/name: kubeclustersnap
    app.kubernetes.io/part-of: kubeclustersnap-idp

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeclustersnap-sa
  namespace: kubeclustersnap-system
  labels:
    app.kubernetes.io/name: kubeclustersnap
    app.kubernetes.io/part-of: kubeclustersnap-idp

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeclustersnap-role
  labels:
    app.kubernetes.io/name: kubeclustersnap
    app.kubernetes.io/part-of: kubeclustersnap-idp
rules:
  # Core API Group: Manage Namespaces, Pods, Services, ConfigMaps, Secrets & Logs
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - pods/status
      - pods/exec
      - pods/log
      - services
      - configmaps
      - secrets
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Networking API Group: Ingress Routes
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch

  # Apps API Group: Deployments & Image Tags
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeclustersnap-binding
  labels:
    app.kubernetes.io/name: kubeclustersnap
    app.kubernetes.io/part-of: kubeclustersnap-idp
subjects:
  - kind: ServiceAccount
    name: kubeclustersnap-sa
    namespace: kubeclustersnap-system
roleRef:
  kind: ClusterRole
  name: kubeclustersnap-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeclustersnap-backend
  namespace: kubeclustersnap-system
  labels:
    app: kubeclustersnap-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeclustersnap-backend
  template:
    metadata:
      labels:
        app: kubeclustersnap-backend
    spec:
      serviceAccountName: kubeclustersnap-sa
      containers:
        - name: backend
          image: ghcr.io/anilkumar2713/kubeclustersnap-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: KUBECLUSTERSNAP_LICENSE_KEY
              value: "KCS-ENT-PROD-3648F75762ED"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: kubeclustersnap-backend-svc
  namespace: kubeclustersnap-system
spec:
  type: NodePort
  selector:
    app: kubeclustersnap-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30888

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeclustersnap-frontend
  namespace: kubeclustersnap-system
  labels:
    app: kubeclustersnap-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeclustersnap-frontend
  template:
    metadata:
      labels:
        app: kubeclustersnap-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/anilkumar2713/kubeclustersnap-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: kubeclustersnap-frontend-svc
  namespace: kubeclustersnap-system
spec:
  type: NodePort
  selector:
    app: kubeclustersnap-frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30333
