services:
  # KubeClusterSnap Control Plane Backend (Built locally)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kubeclustersnap-backend:local
    container_name: kubeclustersnap-backend-dev
    restart: unless-stopped
    ports:
      - "30888:8000"
    environment:
      - KUBECLUSTERSNAP_LICENSE_KEY=KCS-ENT-PROD-3648F75762ED
      - SNAPSHOT_DIR=/app/snapshots
      - KUBECONFIG_DIR=/app/kubeconfigs
    volumes:
      - ${USERPROFILE:-~}/.kube/config:/root/.kube/config:ro
      - kubeclustersnap-snapshots-dev:/app/snapshots
      - kubeclustersnap-kubeconfigs-dev:/app/kubeconfigs

  # KubeClusterSnap Frontend UI Dashboard (Built locally)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:30888
    image: kubeclustersnap-frontend:local
    container_name: kubeclustersnap-frontend-dev
    restart: unless-stopped
    ports:
      - "30333:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:30888
    depends_on:
      - backend

volumes:
  kubeclustersnap-snapshots-dev:
  kubeclustersnap-kubeconfigs-dev:
